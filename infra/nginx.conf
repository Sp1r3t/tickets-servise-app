events { worker_connections 2048; }
http {
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    server {
        listen 80;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
        proxy_set_header X-Internal-Key "";
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location /api/v1/auth/ { limit_req zone=auth_limit burst=20 nodelay; proxy_pass http://identity:8000/auth/; }
        location ~ ^/api/v1/organizer/events/([^/]+)/sales$ { limit_req zone=api_limit burst=30 nodelay; rewrite ^/api/v1/(.*)$ /$1 break; proxy_pass http://orders:8000; }
        location /api/v1/organizer/ { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://catalog:8000/organizer/; }
        location /api/v1/halls { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://catalog:8000/halls; }
        location /api/v1/events { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://catalog:8000/events; }
        location /api/v1/widgets/ { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://catalog:8000/widgets/; }
        location /api/v1/inventory/ { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://inventory:8000/inventory/; }
        location /api/v1/orders { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://orders:8000/orders; }
        location /api/v1/tickets/ { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://orders:8000/tickets/; }
        location /api/v1/payments/ { limit_req zone=api_limit burst=30 nodelay; proxy_pass http://payments:8000/payments/; }
        location /api/health { default_type application/json; return 200 '{"gateway":"ok"}'; }
        location / { return 404; }
    }
}
