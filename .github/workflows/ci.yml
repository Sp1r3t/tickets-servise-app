name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.lock.txt
      - run: ruff check services scripts tests migrations
      - run: ruff format --check services scripts tests migrations
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:5432/postgres
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.25.0' }
      - run: pip install -r requirements.lock.txt
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: |
          python scripts/init_env.py
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 120
          pnpm --dir frontend test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - run: docker compose logs --no-color > /tmp/ticketflow-services.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results
            /tmp/ticketflow-services.log
      - run: docker compose down
        if: always()
