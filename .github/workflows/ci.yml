name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.lock.txt
      - run: ruff check services scripts tests migrations
      - run: ruff format --check services scripts tests migrations
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only-password@127.0.0.1:5432/postgres
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.25.0' }
      - run: pip install -r requirements.lock.txt
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: |
          python scripts/init_env.py
          python scripts/dev.py --built > /tmp/ticketflow-services.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Services did not become healthy')
          PY
          pnpm --dir frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results
            /tmp/ticketflow-services.log
